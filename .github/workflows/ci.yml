name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default GITHUB_TOKEN needs only checkout — least privilege. The repo is PRIVATE today and
# flips public at launch (FLIP-CHECKLIST row C5); `contents: read` is correct either way, and is
# what keeps a fork PR from being handed write scope once that flip happens.
permissions:
  contents: read

jobs:
  # Lint needs no docs — always runs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Build + test index the sibling docs, so this job needs read access to the docs repos.
  #
  # ⚠️ THE GATE MUST BE ABLE TO FAIL. This job used to self-skip whenever DOCS_REPOS_TOKEN was unset,
  # unconditionally — so an unset or **EXPIRED** secret produced a fully green CI run with zero build
  # and zero test coverage, on `main`, indistinguishable from a real pass. That matters concretely
  # here: the PAT expires 2026-08-09 (see PUBLISHING.md), and the day it lapses this job would have
  # gone quietly green forever. Skipping is legitimate in exactly one case — a PR from a FORK, where
  # GitHub deliberately withholds secrets from the workflow. Everywhere else (a push to main, a
  # same-repo PR) a missing token is a broken CI configuration and must be loud.
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Docs-token gate (hard-fail except on fork PRs)
        id: gate
        env:
          DOCS_REPOS_TOKEN: ${{ secrets.DOCS_REPOS_TOKEN }}
          # True only for a pull_request whose head repo is NOT this repo, i.e. a fork — the one
          # context where GitHub does not expose secrets to the workflow.
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$DOCS_REPOS_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "::notice title=Docs build skipped::No DOCS_REPOS_TOKEN — secrets are not exposed to fork PRs. The docs index cannot be built, so build+test are skipped for this PR; a maintainer push to main runs them."
            exit 0
          fi
          echo "::error title=DOCS_REPOS_TOKEN missing::The docs index is built from the sibling docs repos and needs the DOCS_REPOS_TOKEN secret (fine-grained PAT, read Contents on cendor-libs / cendor-sdk / cendor-libs-js / cendor-cookbook). It is unset, revoked, or EXPIRED — it expires 2026-08-09; see PUBLISHING.md. Failing rather than reporting a green run that built nothing and tested nothing."
          exit 1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        if: steps.gate.outputs.ok == 'true'
        with:
          version: 9.14.2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.ok == 'true'
      - name: Fetch sibling docs (sparse clone)
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_DOCS_TOKEN: ${{ secrets.DOCS_REPOS_TOKEN }}
        run: node scripts/fetch-docs.mjs
      - run: pnpm build
        if: steps.gate.outputs.ok == 'true'
      - run: pnpm test
        if: steps.gate.outputs.ok == 'true'
