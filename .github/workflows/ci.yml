name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default GITHUB_TOKEN needs only checkout — least privilege. The repo is PRIVATE today and
# flips public at launch (FLIP-CHECKLIST row C5); `contents: read` is correct either way, and is
# what keeps a fork PR from being handed write scope once that flip happens.
permissions:
  contents: read

jobs:
  # Lint needs no docs — always runs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Build + test index the sibling docs (cendor-libs, cendor-sdk, cendor-libs-js, cendor-cookbook).
  # All are public since the 2026-07-29 flip, so the sparse clone is unauthenticated and this job
  # ALWAYS runs — including on fork PRs, which is new: it needs no secret at all now.
  #
  # HISTORY, because this gate was the sharp edge here: the job originally self-skipped whenever
  # DOCS_REPOS_TOKEN was unset, so an unset or EXPIRED secret produced a fully green run on `main`
  # with zero build and zero tests, indistinguishable from a real pass — and that PAT was due to
  # expire 2026-08-09. It was later made a hard failure everywhere except fork PRs. Going public
  # removes the token, and with it the whole class of problem.
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch sibling docs (sparse clone, unauthenticated)
        run: node scripts/fetch-docs.mjs
      - run: pnpm build
      - run: pnpm test
