name: Release

# RELEASE POSTURE — HELD FOR LAUNCH. Both artifacts ship from here; MANUAL ONLY (workflow_dispatch),
# each gated behind an input so they publish independently:
#   • npm  @cendor/mcp — changeset publish (needs the NPM_TOKEN secret). First publish can also be done
#     locally (`pnpm publish`); thereafter uncomment the push trigger to match the other cendor JS repos.
#   • PyPI cendor-mcp  — OIDC **trusted publishing** (publisher = repo cendorhq/cendor-mcp, this
#     workflow release.yml, environment `mcp`). No token; the `mcp` environment + id-token: write below
#     are what the publisher matches on.
# Both build the docs index from the sibling docs first (fetch-docs needs DOCS_REPOS_TOKEN while the
# docs repos are private). See PUBLISHING.md.
on:
  workflow_dispatch:
    inputs:
      npm:
        description: 'Publish @cendor/mcp to npm (needs NPM_TOKEN)'
        type: boolean
        default: false
      pypi:
        description: 'Publish cendor-mcp to PyPI (OIDC trusted publishing, env mcp)'
        type: boolean
        default: false
  # push:
  #   branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  npm:
    if: ${{ inputs.npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit version bump + push tags back to main
      id-token: write # npm provenance via OIDC (once public)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.14.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Fetch sibling docs (sparse clone)
        env:
          GH_DOCS_TOKEN: ${{ secrets.DOCS_REPOS_TOKEN }}
        run: node scripts/fetch-docs.mjs
      - run: pnpm build
      - name: Version + publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm exec changeset version
          git add -A
          git commit -m "chore: version packages [skip ci]" || echo "no version changes to commit"
          pnpm exec changeset publish
          git push --follow-tags origin HEAD:main || echo "nothing to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'false' # provenance off while repo is private (sigstore E422)

  pypi:
    if: ${{ inputs.pypi }}
    runs-on: ubuntu-latest
    environment: mcp # matches the PyPI trusted publisher
    permissions:
      id-token: write # OIDC trusted publishing — no stored token
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.14.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch sibling docs (sparse clone)
        env:
          GH_DOCS_TOKEN: ${{ secrets.DOCS_REPOS_TOKEN }}
        run: node scripts/fetch-docs.mjs
      - name: Build docs index (writes python/src/cendor_mcp/_data/index.json)
        run: pnpm build:index
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build wheel + sdist
        working-directory: python
        run: uv build
      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python/dist
