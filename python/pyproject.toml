[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cendor-mcp"
version = "0.1.0"
description = "Read-only MCP server that hands your AI coding assistant Cendor's live docs and correct call-shapes. Run offline with `uvx cendor-mcp`."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Raghav Mishra (PowerAI Labs)" }]
keywords = ["mcp", "model-context-protocol", "llm", "docs", "cendor", "ai-assistant"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]
dependencies = ["mcp>=1.0"]

[project.urls]
Homepage = "https://cendor.ai/mcp"
Repository = "https://github.com/cendorhq/cendor-mcp"
Issues = "https://github.com/cendorhq/cendor-mcp/issues"

[project.scripts]
cendor-mcp = "cendor_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cendor_mcp"]

# The docs index is GENERATED (gitignored) by the Node build (scripts/build-index.mjs), which also
# writes it here. Force-include it in the wheel so `uvx cendor-mcp` ships fully offline. Build order:
# run `pnpm build:index` (from the repo root) BEFORE `uv build` here. See PUBLISHING.md.
[tool.hatch.build]
artifacts = ["src/cendor_mcp/_data/index.json"]
